version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: soundcloud_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: yourpassword
      POSTGRES_DB: soundcloud_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d soundcloud_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  opensearch:
    image: opensearchproject/opensearch:latest
    container_name: soundcloud_opensearch
    restart: always
    environment:
      - discovery.type=single-node
      - plugins.security.disabled=true
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - '9200:9200'
    volumes:
      - opensearch_data:/usr/share/opensearch/data

  api:
    build:
      context: .
      target: production
    container_name: soundcloud_be_api
    restart: always
    ports:
      - '3000:3000'
    env_file:
      - .env
    environment:
      OPENSEARCH_NODE: http://opensearch:9200
    command: sh -c "npx prisma db push && node dist/src/main.js"
    depends_on:
      db:
        condition: service_healthy
      opensearch:
        condition: service_started

volumes:
  postgres_data:
  opensearch_data:
