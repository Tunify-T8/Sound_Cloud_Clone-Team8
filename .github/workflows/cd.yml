name: CD

on:
  push:
    branches: [main]

env:
  DOCKERHUB_FRONTEND: amirdiaa/soundcloud-frontend
  DOCKERHUB_BACKEND: amirdiaa/soundcloud-backend

jobs:
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.DOCKERHUB_FRONTEND }}:latest
            ${{ env.DOCKERHUB_FRONTEND }}:${{ github.sha }}
          build-args: |
            VITE_USE_MOCK=false
            VITE_REAL_API_URL=${{ secrets.BACKEND_URL }}
            VITE_GOOGLE_CLIENT_ID=${{ secrets.VITE_GOOGLE_CLIENT_ID }}
            VITE_GOOGLE_REDIRECT_URI=${{ secrets.VITE_GOOGLE_REDIRECT_URI }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.DOCKERHUB_BACKEND }}:latest
            ${{ env.DOCKERHUB_BACKEND }}:${{ github.sha }}

  deploy:
    name: Deploy to Azure VM
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copy docker-compose to VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.AZURE_VM_HOST }}
          username: ${{ secrets.AZURE_VM_USERNAME }}
          key: ${{ secrets.AZURE_VM_SSH_KEY }}
          source: "docker-compose.prod.yml,Caddyfile"
          target: ~/app

      - name: Deploy on Azure VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AZURE_VM_HOST }}
          username: ${{ secrets.AZURE_VM_USERNAME }}
          key: ${{ secrets.AZURE_VM_SSH_KEY }}
          script: |
            cd ~/app

            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

            # Pull latest images
            docker pull ${{ env.DOCKERHUB_FRONTEND }}:latest
            docker pull ${{ env.DOCKERHUB_BACKEND }}:latest

            # Create .env for production
            cat > .env <<EOF
            BACKEND_URL=${{ secrets.BACKEND_URL }}
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
            DOMAIN_NAME=${{ secrets.DOMAIN_NAME }}
            ${{ secrets.BACKEND_ENV_VARS }}
            EOF

            # Deploy with production compose
            docker compose -f docker-compose.prod.yml up -d --force-recreate

            for service in db redis opensearch backend frontend caddy; do
              timeout=180

              while [ "$timeout" -gt 0 ]; do
                container_id="$(docker compose -f docker-compose.prod.yml ps -q "$service")"

                if [ -n "$container_id" ]; then
                  status="$(docker inspect -f '{{.State.Status}}' "$container_id" 2>/dev/null || true)"
                  health="$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$container_id" 2>/dev/null || true)"

                  if [ "$status" = "running" ] && { [ "$health" = "healthy" ] || [ "$health" = "none" ]; }; then
                    break
                  fi

                  if [ "$status" = "exited" ] || [ "$status" = "dead" ]; then
                    echo "Service $service is $status during deployment"
                    docker compose -f docker-compose.prod.yml logs --no-color --tail=100 "$service" || true
                    exit 1
                  fi
                fi

                sleep 5
                timeout=$((timeout - 5))
              done

              if [ "$timeout" -le 0 ]; then
                echo "Timed out waiting for $service to become ready"
                docker compose -f docker-compose.prod.yml logs --no-color --tail=100 "$service" || true
                exit 1
              fi
            done

            # Run database migrations
            docker compose -f docker-compose.prod.yml exec -T backend npx prisma migrate deploy

            docker compose -f docker-compose.prod.yml ps

            for service in db redis opensearch backend frontend caddy; do
              container_id="$(docker compose -f docker-compose.prod.yml ps -q "$service")"

              if [ -z "$container_id" ]; then
                echo "Service $service does not have a container after deployment"
                docker compose -f docker-compose.prod.yml logs --no-color --tail=100 "$service" || true
                exit 1
              fi

              status="$(docker inspect -f '{{.State.Status}}' "$container_id")"
              if [ "$status" != "running" ]; then
                echo "Service $service is $status after deployment"
                docker compose -f docker-compose.prod.yml logs --no-color --tail=100 "$service" || true
                exit 1
              fi
            done

            # Cleanup old images
            docker image prune -f
