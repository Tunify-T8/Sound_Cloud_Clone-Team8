name: CD

on:
  push:
    branches: [main]

env:
  DOCKERHUB_FRONTEND: amirdiaa/soundcloud-frontend
  DOCKERHUB_BACKEND: amirdiaa/soundcloud-backend

jobs:
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push frontend
        run: |
          docker build \
            --build-arg VITE_USE_MOCK=false \
            --build-arg VITE_REAL_API_URL=${{ secrets.BACKEND_URL }} \
            -t ${{ env.DOCKERHUB_FRONTEND }}:latest \
            -t ${{ env.DOCKERHUB_FRONTEND }}:${{ github.sha }} \
            ./frontend
          docker push ${{ env.DOCKERHUB_FRONTEND }}:latest
          docker push ${{ env.DOCKERHUB_FRONTEND }}:${{ github.sha }}

      - name: Build and push backend
        run: |
          docker build \
            -t ${{ env.DOCKERHUB_BACKEND }}:latest \
            -t ${{ env.DOCKERHUB_BACKEND }}:${{ github.sha }} \
            ./backend
          docker push ${{ env.DOCKERHUB_BACKEND }}:latest
          docker push ${{ env.DOCKERHUB_BACKEND }}:${{ github.sha }}

  deploy:
    name: Deploy to Azure VM
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copy docker-compose to VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.AZURE_VM_HOST }}
          username: ${{ secrets.AZURE_VM_USERNAME }}
          key: ${{ secrets.AZURE_VM_SSH_KEY }}
          source: "docker-compose.prod.yml,Caddyfile"
          target: ~/app

      - name: Deploy on Azure VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AZURE_VM_HOST }}
          username: ${{ secrets.AZURE_VM_USERNAME }}
          key: ${{ secrets.AZURE_VM_SSH_KEY }}
          script: |
            cd ~/app

            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

            # Pull latest images
            docker pull ${{ env.DOCKERHUB_FRONTEND }}:latest
            docker pull ${{ env.DOCKERHUB_BACKEND }}:latest

            # Create .env for production
            cat > .env <<EOF
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            BACKEND_URL=${{ secrets.BACKEND_URL }}
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
            DOMAIN_NAME=${{ secrets.DOMAIN_NAME }}
            ${{ secrets.BACKEND_ENV_VARS }}
            EOF

            # Deploy with production compose
            docker compose -f docker-compose.prod.yml up -d --force-recreate

            # Run database migrations
            docker compose -f docker-compose.prod.yml exec -T backend npx prisma migrate deploy

            # Cleanup old images
            docker image prune -f
