services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: soundcloud
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: soundcloud
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U soundcloud -d soundcloud"]
      interval: 5s
      timeout: 5s
      retries: 5
    # No ports exposed — only backend talks to db internally

  backend:
    image: amirdiaa/soundcloud-backend:latest
    restart: always
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: amirdiaa/soundcloud-frontend:latest
    restart: always
    depends_on:
      - backend

  caddy:
    image: caddy:2-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN_NAME: ${DOMAIN_NAME}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend

volumes:
  pgdata:
  caddy_data:
  caddy_config:
