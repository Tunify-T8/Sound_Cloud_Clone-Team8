services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: soundcloud
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: soundcloud
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U soundcloud -d soundcloud"]
      interval: 5s
      timeout: 5s
      retries: 5
    # No ports exposed — only backend talks to db internally

  redis:
    image: redis:7-alpine
    restart: always

  opensearch:
    image: opensearchproject/opensearch:3.5.0
    restart: always
    environment:
      - discovery.type=single-node
      - DISABLE_INSTALL_DEMO_CONFIG=true
      - DISABLE_SECURITY_PLUGIN=true
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - opensearch_data:/usr/share/opensearch/data

  backend:
    image: amirdiaa/soundcloud-backend:latest
    restart: always
    env_file:
      - .env
    environment:
      REDIS_HOST: redis
      OPENSEARCH_NODE: http://opensearch:9200
    depends_on:
      db:
        condition: service_healthy
      opensearch:
        condition: service_started

  frontend:
    image: amirdiaa/soundcloud-frontend:latest
    restart: always
    depends_on:
      - backend

  caddy:
    image: caddy:2-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN_NAME: ${DOMAIN_NAME}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend

volumes:
  pgdata:
  opensearch_data:
  caddy_data:
  caddy_config:
