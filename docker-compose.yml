services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: soundcloud
      POSTGRES_PASSWORD: soundcloud
      POSTGRES_DB: soundcloud
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  opensearch:
    image: opensearchproject/opensearch:latest
    restart: always
    environment:
      - discovery.type=single-node
      - plugins.security.disabled=true
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "9200:9200"
    volumes:
      - opensearch_data:/usr/share/opensearch/data

  backend:
    build: ./backend
    restart: always
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://soundcloud:soundcloud@db:5432/soundcloud
      OPENSEARCH_NODE: http://opensearch:9200
      PORT: 3000
    depends_on:
      - db
      - opensearch

  frontend:
    build:
      context: ./frontend
      args:
        VITE_USE_MOCK: "false"
        VITE_REAL_API_URL: http://localhost:3000
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  pgdata:
  opensearch_data:
