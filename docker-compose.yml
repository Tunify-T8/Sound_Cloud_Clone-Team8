services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: soundcloud
      POSTGRES_PASSWORD: soundcloud
      POSTGRES_DB: soundcloud
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    restart: always
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://soundcloud:soundcloud@db:5432/soundcloud
      PORT: 3000
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      args:
        VITE_USE_MOCK: "false"
        VITE_REAL_API_URL: http://localhost:3000
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  pgdata:
